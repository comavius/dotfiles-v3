name: Merge host branches

on:
  push:
    branches:
      - "host/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: merge-host-branches
  cancel-in-progress: false

jobs:
  merge-to-main:
    name: Merge host branch to main
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Merge pushed host branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin "+refs/heads/${GITHUB_REF_NAME}:refs/remotes/origin/${GITHUB_REF_NAME}"
          git merge --no-edit "origin/${GITHUB_REF_NAME}"
          git push origin HEAD:main
